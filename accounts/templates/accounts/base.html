<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Seminar Hall Management{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            Seminar Hall Management
        </a>

        <div class="navbar-nav ms-auto">

            {% if user.is_authenticated %}

                <a class="nav-link" href="{% url 'dashboard' %}">
                    Dashboard
                </a>

                <a class="nav-link" href="{% url 'book_hall' %}">
                    Book Hall
                </a>

                <a class="nav-link" href="{% url 'my_bookings' %}">
                    My Bookings
                </a>

                <a class="nav-link" href="{% url 'hall_list' %}">
                    Seminar Halls
                </a>

                <a class="nav-link" href="{% url 'logout' %}">
                    Logout
                </a>

            {% else %}

                <a class="nav-link" href="{% url 'login' %}">
                    Login
                </a>

                <a class="nav-link" href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>
</nav>

<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>

<footer class="bg-dark text-white text-center mt-5 p-3">
    © 2026 Seminar Hall Management System
</footer>

</body>
</html>
